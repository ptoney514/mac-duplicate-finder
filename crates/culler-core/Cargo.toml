[package]
name = "culler-core"
version.workspace = true
edition.workspace = true

[lib]
# staticlib feeds the XCFramework; cdylib feeds uniffi-bindgen library mode.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
blake3 = "1"
image = "0.25"
kamadak-exif = "0.6"
ort = { version = "2.0.0-rc.10", features = ["coreml"] }
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
# Approved addition (PRD §15 ask): exact CLIP BPE via the model's tokenizer.json.
tokenizers = "0.21"
uniffi = "0.29"
usearch = "2"
walkdir = "2"

[dev-dependencies]
# Same crates as above (no new dependencies): tests verify hashes against
# blake3 directly, inspect schema/rows through a second connection, and
# generate synthetic test images with `image`.
blake3 = "1"
image = "0.25"
rusqlite = { version = "0.32", features = ["bundled"] }
