[package]
name = "culler-core"
version.workspace = true
edition.workspace = true

[dependencies]
blake3 = "1"
image = "0.25"
kamadak-exif = "0.6"
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
walkdir = "2"

[dev-dependencies]
# Same crates as above (no new dependencies): tests verify hashes against
# blake3 directly, inspect schema/rows through a second connection, and
# generate synthetic test images with `image`.
blake3 = "1"
image = "0.25"
rusqlite = { version = "0.32", features = ["bundled"] }
